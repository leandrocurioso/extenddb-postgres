# Client-domain Go service. Uses the stock AWS SDK DynamoDB client, pointed at
# the cell-local ExtendDB.
apiVersion: v1
kind: Service
metadata:
  name: clients-api
  labels:
    app.kubernetes.io/name: clients-api
    app.kubernetes.io/component: clients-api
spec:
  selector:
    app.kubernetes.io/name: clients-api
  ports:
    - { name: http, port: 80, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clients-api
  labels:
    app.kubernetes.io/name: clients-api
    app.kubernetes.io/component: clients-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clients-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clients-api
        app.kubernetes.io/component: clients-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clients-api
          image: extenddb-lab/clients-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CELL_ID
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: EXTENDDB_ENDPOINT
              value: https://extenddb:18443
            - name: EXTENDDB_CA_FILE
              value: /etc/extenddb-ca/cert.pem
            - name: AWS_REGION
              value: us-east-1
            - name: TABLE_NAME
              value: Clients
            - name: SIMULATE_INTERVAL
              value: 15s
          envFrom:
            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY of this cell's IAM user.
            - secretRef:
                name: clients-api-aws
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: extenddb-ca, mountPath: /etc/extenddb-ca, readOnly: true }
      volumes:
        # Only the public certificate is mounted, never the key.
        - name: extenddb-ca
          secret:
            secretName: extenddb-tls
            items:
              - { key: cert.pem, path: cert.pem }
