# Cell-local PostgreSQL router. Every cell has one; each checks all three
# Patroni members over the REST API and forwards to whichever one Patroni (via
# the Consul leader lock) says is primary.
global
    log stdout format raw local0 info
    maxconn 2000

resolvers kubedns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold obsolete 10s

defaults
    mode tcp
    log global
    option tcplog
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions resolvers kubedns init-addr last,libc,none

# Read/write: only the current Patroni leader answers 200 on /primary.
listen pg-primary
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    server cell-1 patroni-0.patroni.cell-1.svc.cluster.local:5432 check port 8008
    server cell-2 patroni-0.patroni.cell-2.svc.cluster.local:5432 check port 8008
    server cell-3 patroni-0.patroni.cell-3.svc.cluster.local:5432 check port 8008

# Read-only: streaming replicas.
listen pg-replicas
    bind :5433
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    server cell-1 patroni-0.patroni.cell-1.svc.cluster.local:5432 check port 8008
    server cell-2 patroni-0.patroni.cell-2.svc.cluster.local:5432 check port 8008
    server cell-3 patroni-0.patroni.cell-3.svc.cluster.local:5432 check port 8008

frontend stats
    mode http
    bind :8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 5s
