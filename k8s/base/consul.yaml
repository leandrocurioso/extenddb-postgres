# One Consul server per cell. The three servers retry-join each other across
# namespaces and form a single Raft cluster (bootstrap-expect=3) that Patroni
# uses as its DCS for leader election.
apiVersion: v1
kind: Service
metadata:
  name: consul-headless
  labels:
    app.kubernetes.io/name: consul
    app.kubernetes.io/component: consul
spec:
  clusterIP: None
  # Peers must resolve before they are Ready, or the cluster can never form.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: consul
  ports:
    - { name: server, port: 8300, protocol: TCP }
    - { name: serf-tcp, port: 8301, protocol: TCP }
    - { name: serf-udp, port: 8301, protocol: UDP }
    - { name: http, port: 8500, protocol: TCP }
---
# Cell-local entry point for Consul clients (Patroni).
apiVersion: v1
kind: Service
metadata:
  name: consul
  labels:
    app.kubernetes.io/name: consul
    app.kubernetes.io/component: consul
spec:
  selector:
    app.kubernetes.io/name: consul
  ports:
    - { name: http, port: 8500, protocol: TCP }
    - { name: dns-tcp, port: 8600, protocol: TCP }
    - { name: dns-udp, port: 8600, protocol: UDP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  labels:
    app.kubernetes.io/name: consul
    app.kubernetes.io/component: consul
spec:
  serviceName: consul-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: consul
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consul
        app.kubernetes.io/component: consul
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: consul
          image: hashicorp/consul:1.22.7
          # The image entrypoint adds -data-dir=/consul/data and
          # -config-dir=/consul/config for the "agent" command.
          args:
            - agent
            - -server
            - -bootstrap-expect=3
            - -datacenter=dc1
            - -node=$(NAMESPACE)
            - -node-meta=cell:$(NAMESPACE)
            - -bind=0.0.0.0
            - -advertise=$(POD_IP)
            - -client=0.0.0.0
            - -ui
            - -retry-join=consul-0.consul-headless.cell-1.svc.cluster.local
            - -retry-join=consul-0.consul-headless.cell-2.svc.cluster.local
            - -retry-join=consul-0.consul-headless.cell-3.svc.cluster.local
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          ports:
            - { name: server, containerPort: 8300 }
            - { name: serf-tcp, containerPort: 8301, protocol: TCP }
            - { name: serf-udp, containerPort: 8301, protocol: UDP }
            - { name: http, containerPort: 8500 }
            - { name: dns-tcp, containerPort: 8600, protocol: TCP }
            - { name: dns-udp, containerPort: 8600, protocol: UDP }
          readinessProbe:
            # Ready only once this server knows the Raft leader.
            exec:
              command: ["/bin/sh", "-ec", "wget -qO- http://127.0.0.1:8500/v1/status/leader | grep -q ':8300'"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/agent/self, port: 8500 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /consul/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
