# Cell-local HAProxy that always points at the current Patroni primary.
# ExtendDB connects to "pg-primary", which resolves inside its own namespace.
apiVersion: v1
kind: Service
metadata:
  name: pg-primary
  labels:
    app.kubernetes.io/name: pg-router
    app.kubernetes.io/component: pg-router
spec:
  selector:
    app.kubernetes.io/name: pg-router
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: Service
metadata:
  name: pg-replicas
  labels:
    app.kubernetes.io/name: pg-router
    app.kubernetes.io/component: pg-router
spec:
  selector:
    app.kubernetes.io/name: pg-router
  ports:
    - { name: postgres, port: 5432, targetPort: 5433 }
---
apiVersion: v1
kind: Service
metadata:
  name: pg-router-stats
  labels:
    app.kubernetes.io/name: pg-router
    app.kubernetes.io/component: pg-router
spec:
  selector:
    app.kubernetes.io/name: pg-router
  ports:
    - { name: stats, port: 8404 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-router
  labels:
    app.kubernetes.io/name: pg-router
    app.kubernetes.io/component: pg-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-router
        app.kubernetes.io/component: pg-router
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
      containers:
        - name: haproxy
          image: haproxy:3.2.25-alpine
          ports:
            - { name: primary, containerPort: 5432 }
            - { name: replicas, containerPort: 5433 }
            - { name: stats, containerPort: 8404 }
          readinessProbe:
            tcpSocket: { port: 5432 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8404 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /usr/local/etc/haproxy, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: pg-router-config
