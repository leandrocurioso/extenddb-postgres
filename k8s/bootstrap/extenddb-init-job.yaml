# Creates the ExtendDB catalog + data databases, application role, encryption
# key and admin user on the Patroni primary (through cell-1's pg-primary).
# Re-running it against an initialized cluster applies pending migrations.
#
# Note: init records the data-database connection string in the catalog as
# postgresql://extenddb_app:...@pg-primary:5432/extenddb. "pg-primary" is a
# short name, so every cell's ExtendDB resolves it to its own router.
apiVersion: batch/v1
kind: Job
metadata:
  name: extenddb-init
  labels:
    app.kubernetes.io/name: extenddb-init
    app.kubernetes.io/component: extenddb-bootstrap
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extenddb-init
        app.kubernetes.io/component: extenddb-bootstrap
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        cell: cell-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          image: ghcr.io/extenddb/extenddb-postgres:0.1.13
          command:
            - /bin/sh
            - -ec
            - |
              cat > "$HOME/extenddb.toml" <<'TOML'
              [server]
              bind_addr = "0.0.0.0"
              [storage]
              backend = "postgres"
              [storage.postgres]
              connection_string = "postgresql://extenddb_app@pg-primary:5432/extenddb_catalog"
              TOML
              chmod 600 "$HOME/extenddb.toml"

              if extenddb init --config "$HOME/generated.toml" --backend postgres \
                   --pg-host pg-primary --pg-port 5432 --pg-user postgres \
                   --extenddb-user extenddb_app --bind-addr 0.0.0.0 >"$HOME/init.log" 2>&1; then
                cat "$HOME/init.log"
                echo "extenddb-init: fresh catalog initialized"
                exit 0
              fi
              cat "$HOME/init.log"
              if grep -q "Database 'extenddb[_a-z]*' already exists" "$HOME/init.log"; then
                echo "extenddb-init: catalog exists, applying migrations"
                exec extenddb migrate --config "$HOME/extenddb.toml" --yes --pg-user postgres
              fi
              exit 1
          env:
            - name: HOME
              value: /work
            - name: EXTENDDB_PG_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: superuser-password } }
            - name: EXTENDDB_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: app-password } }
            - name: EXTENDDB_ADMIN_USER
              value: admin
            - name: EXTENDDB_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: extenddb-admin, key: password } }
            # Used by the migrate path, which reads the connection from config.
            - name: PG_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: app-password } }
            - name: EXTENDDB__STORAGE__POSTGRES__CONNECTION_STRING
              value: postgresql://extenddb_app:$(PG_APP_PASSWORD)@pg-primary:5432/extenddb_catalog
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: work, mountPath: /work }
      volumes:
        - name: work
          emptyDir: {}
